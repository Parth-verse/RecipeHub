spring.application.name=RecipeHub
# Oracle Listener occupies port 8080 on this system, so we use 8085
server.port=8085

# =============================================================
# MySQL Database Configuration
# =============================================================
# By default, RecipeHub is configured to connect to MySQL on localhost:3306.
# If your MySQL password or username is different, update them here:
spring.datasource.url=jdbc:mysql://localhost:3306/recipehub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Database password read securely from environment variable (protects credentials on GitHub)
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
# 'update': automatically creates or updates tables to match our Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
